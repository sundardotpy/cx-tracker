{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-zinc-950 border border-zinc-800 p-8 rounded-xl shadow-2xl">
    <h2 class="text-xl font-bold text-white mb-6 text-center tracking-tight">Admin Authentication</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-[11px] uppercase font-bold text-zinc-500 mb-1.5 tracking-wider">Username</label>
            <input type="text" name="username" required autocomplete="off" class="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#05a54b] transition">
        </div>
        <div>
            <label class="block text-[11px] uppercase font-bold text-zinc-500 mb-1.5 tracking-wider">Password</label>
            <input type="password" name="password" required class="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#05a54b] transition">
        </div>
        <button type="submit" class="w-full mt-2 bg-[#05a54b] text-white font-semibold py-2.5 rounded-lg text-sm hover:opacity-90 transition shadow-lg shadow-[#05a54b]/10">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
